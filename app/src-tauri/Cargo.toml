[package]
name = "app"
version = "0.3.3"
description = "ZTKN - PC hardware monitor with customizable skin panels"
authors = ["Lo-Ai Voice"]
edition = "2021"
default-run = "app"

# ztkn-hook を独立クレート化（tauri-build を通さない＝requireAdministrator を継承しないので、
# 非昇格の Codex/Claude から起動されても UAC が出ない）。target を共有するため成果物は従来と同じ
# target/debug/ztkn-hook.exe。
[workspace]
members = ["ztkn-hook"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# AI使用量取得用: 軽量ブロッキングHTTP + RFC3339パース。
# TLSはOSネイティブのSChannel(native-tls)=Cビルド(ring)不要・OS証明書ストア利用でWindowsで確実に通る。
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2" # ureqへ明示注入するSChannelコネクタ（native-tlsは手動配線が要る）
chrono = { version = "0.4", default-features = false, features = ["std"] }
# VUメーター用の音声取り込み。出力デバイスに build_input_stream すると
# WASAPI のループバックになる（追加のWindows機能もunsafeも不要）。
cpal = "0.15"
# ビジュアライザの周波数解析。2048点のFFTを60Hzで回す。
rustfft = "6"
# ページを描くプロセス（WebView2 の renderer）のメモリを測る。溜まりすぎたら画面を読み込み直すため。
# すでに依存に入っている版を使い、機能だけ足す。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Wdk_System_Threading"] }
# AI連携フックの設定書き込み用。Codex の config.toml は利用者が手で書いた設定・コメントが
# 入っているため、丸ごと再生成せず該当箇所だけ差し替える toml_edit を使う。
toml_edit = "0.22"

